<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ShapeDiver Table</title>
  <style>
    #viewer {
      width: 100%;
      height: 400px;
    }

    #table-container {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 8px;
      border: 1px solid #ddd;
    }

    thead {
      position: sticky;
      top: 0;
      background: white;
    }
  </style>
</head>
<body>

<div id="viewer"></div>

<div id="table-container">
  <table id="data-table"></table>
</div>

<script type="module">
import { createSession } from "https://viewer.shapediver.com/v3/viewer.js";

const session = await createSession({
  ticket: "8c7933b04a6664d65f67dca478a895ebde82b5d18f189cc55da6320998567fc42627ce0175b7155292ebd09b7ff58b7858b994aa293e7aefd636deec1808ef494334c074dc7e6ca4e4b3fe18a3c83bbb6125cfc35041d3f1dbdda8a403020653f01cc63c7882e578e7abd8bb9175cba18cf6b8116a4769f3-027d1a26201ee13adc0edcfd4f07eea2",
  modelViewUrl: "https://sdr8euc1.eu-central-1.shapediver.com"
});

function buildTable(data) {
  const table = document.getElementById("data-table");
  table.innerHTML = "";

  if (!data.length) return;

  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");

  Object.keys(data[0]).forEach(key => {
    const th = document.createElement("th");
    th.textContent = key;
    headerRow.appendChild(th);
  });

  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  data.forEach(row => {
    const tr = document.createElement("tr");

    Object.values(row).forEach(value => {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
}

function updateTable() {
  const output = Object.values(session.outputs)[0];
  const jsonString = output.content[0].data;
  const tableData = JSON.parse(jsonString);
  buildTable(tableData);
}

session.addEventListener("customizeEnd", updateTable);

updateTable();
</script>

</body>
</html>
